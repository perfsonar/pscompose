Alias /pscompose /usr/lib/perfsonar/pscompose/frontend

<Directory /usr/lib/perfsonar/pscompose/frontend>
    SSLRequireSSL
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# Reverse proxy /pscompose/api to the pSCompose Gunicorn/Uvicorn service
ProxyPreserveHost On
ProxyPass /pscompose/api unix:/run/perfsonar/pscompose.sock|http://localhost status=+I
ProxyPassReverse /pscompose/api unix:/run/perfsonar/pscompose.sock|http://localhost status=+I
<Location /pscompose/api>
    SSLRequireSSL
    Require all granted
</Location>