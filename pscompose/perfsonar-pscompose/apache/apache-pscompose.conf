ProxyPreserveHost On
# Redirect /pscompose (no trailing slash) to /pscompose/ so index.html is served correctly
RedirectMatch ^/pscompose$ /pscompose/
# Reverse proxy /pscompose/api to the pSCompose Gunicorn/Uvicorn service
ProxyPass /pscompose/api unix:/run/perfsonar/pscompose.sock|http://localhost status=+I
ProxyPassReverse /pscompose/api unix:/run/perfsonar/pscompose.sock|http://localhost status=+I
# Proxy frontend to the pSCompose frontend service (server.py on port 8008)
# Strip the /pscompose prefix so server.py sees paths it recognises (e.g. /css/, /pages/)
ProxyPass /pscompose/ http://localhost:8008/ status=+I
ProxyPassReverse /pscompose/ http://localhost:8008/ status=+I
<Location /pscompose/>
    SSLRequireSSL
    Options +FollowSymLinks -MultiViews
    <IfVersion < 2.4>
      Order allow,deny
      Allow from all
    </IfVersion>
    <IfVersion >= 2.4>
      AuthType Basic
      AuthName "Password Required"
      AuthUserFile /etc/perfsonar/toolkit/psadmin.htpasswd
      Require valid-user
    </IfVersion>
</Location>